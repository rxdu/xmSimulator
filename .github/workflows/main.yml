name: Main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    name: Build & test (MuJoCo)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    steps:
      - uses: actions/checkout@v4

      # gtest for the tests; EGL/Mesa so the camera builds and can render
      # headless (llvmpipe). The lidar/world/dynamics tests are pure CPU.
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libgtest-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri

      - name: Fetch MuJoCo
        run: scripts/setup/fetch_mujoco.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --no-tests=error

  # macOS coverage: AppleClang + libc++ on arm64. MuJoCo ships macOS as a .dmg
  # holding mujoco.framework rather than the include/ + lib/ tarball, which the
  # fetch script remaps. The camera sensor is unavailable here -- macOS has no
  # EGL -- so this lane covers physics, dynamics, lidar and scan patterns; the
  # existing find_library guard reports "camera DISABLED" and builds the rest.
  macos:
    name: Build & test (MuJoCo, macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # googletest: this repo vendors no copy. No EGL/Mesa equivalent exists on
      # macOS, hence no camera.
      - name: Install dependencies
        run: brew install googletest glfw

      - name: Fetch MuJoCo
        run: scripts/setup/fetch_mujoco.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --no-tests=error

